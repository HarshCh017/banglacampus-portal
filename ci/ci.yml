name: BengalCampus Pre-Launch Verification CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Test, Audit & Build
    runs-on: ubuntu-latest

    env:
      AUTH_SECRET: 'ci-secret-not-for-prod-32chars-min-len'
      NEXT_PUBLIC_SITE_URL: 'https://bengalcampus-portal.vercel.app'
      ENQUIRY_NOTIFICATION_EMAIL: 'admissions@bengalcampus.in'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Next.js linter
        run: npm run lint

      - name: Execute automated unit & integration test suite
        run: npm test

      - name: Run Regulatory Provenance Auditor
        run: npm run audit

      - name: Build Next.js production bundle
        run: npm run build
