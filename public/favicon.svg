<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E65D8" />
      <stop offset="45%" stop-color="#1455B8" />
      <stop offset="100%" stop-color="#0A2C68" />
    </linearGradient>
    <linearGradient id="capTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#021438" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Squircle Base matching Header Logo -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="4" />

  <!-- Main Academic Mark -->
  <g filter="url(#shadow)">
    <!-- 1. Cap Base / Band Underneath -->
    <path
      d="M152 248 L152 316 C152 374 360 374 360 316 L360 248 C326 274 292 284 256 284 C220 284 186 274 152 248 Z"
      fill="#FFFFFF"
    />
    <path
      d="M152 248 L152 316 C152 374 360 374 360 316 L360 248"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Subtle Arch Shadow beneath mortarboard rim -->
    <path
      d="M164 256 C200 274 230 280 256 280 C282 280 312 274 348 256 C326 266 292 272 256 272 C220 272 186 266 164 256 Z"
      fill="#CBD5E1"
    />

    <!-- 2. Mortarboard Top (Diamond) -->
    <polygon
      points="256,116 452,206 256,296 60,206"
      fill="url(#capTopGrad)"
      stroke="#FFFFFF"
      stroke-width="8"
      stroke-linejoin="round"
    />

    <!-- 3. Tassel (Originates from center button, drapes to the right side) -->
    <path
      d="M256 206 C 330 206, 404 220, 424 254 C 432 268, 434 288, 434 336"
      fill="none"
      stroke="url(#tasselGrad)"
      stroke-width="15"
      stroke-linecap="round"
    />

    <!-- Center Button -->
    <circle cx="256" cy="206" r="14" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3" />

    <!-- Tassel Ornament / Band -->
    <rect x="426" y="332" width="16" height="8" rx="2" fill="#0284C7" />
    <!-- Tassel Fringe (Hanging threads) -->
    <path
      d="M422 340 L446 340 L448 370 L420 370 Z"
      fill="url(#tasselGrad)"
    />
  </g>
</svg>